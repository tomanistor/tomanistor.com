name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/package.json
          cache: true
          cache_dependency_path: src/pnpm-lock.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/.tool-versions
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm check

      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5

      # Skips JungleScene's component tests when CI is set (see vite.config.ts).
      - run: pnpm vitest run

      # The runners have no GPU, so WebGL renders in software, too slowly for the e2e tests that
      # wait on the live scene. Those stay local.
      - run: pnpm playwright test --grep "404 page has no accessibility|without JavaScript has no accessibility|is prerendered"

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: src/test-results/
          retention-days: 7
